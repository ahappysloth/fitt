name: CI

on:
  pull_request:
  push:
    branches: [main, migration/vinext]
  workflow_dispatch:

permissions:
  contents: read

# New PR commits replace obsolete checks. A running main deployment finishes.
concurrency:
  group: fitt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: Types, tests, and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # Bun installs and runs the scripts; the tools themselves (vite, vitest, wrangler, node --test) still run on Node.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # "packageManager": "bun@x.y.z"
      - name: Install pinned dependencies
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          test -n "$GITHUB_PACKAGES_TOKEN" || { echo "GH_PACKAGES_TOKEN is required to install the private packages."; exit 1; }
          bun install --frozen-lockfile
      - name: Generate Worker types
        run: bun run cf:typegen
      - name: Check formatting and types
        run: |
          bun run format:check
          bun run typecheck
          bun run typecheck:worker
      - name: Test application rules and Worker modules
        run: |
          bun run test
          bun run test:realtime
          bun run test:email-worker
          bun run test:worker-context
      - name: Build and validate the complete Worker
        run: |
          bun run check:deploy
          bun run test:worker-account
      - name: Build standalone previews
        run: |
          bun run build:preview
          bun run build:form-preview
      - name: Install the browser test runtime
        run: bunx playwright install --with-deps chromium
      - name: Test desktop and mobile workflows
        run: bun run test:e2e --reporter=line,github
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy Fitt to Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # Bun installs and runs the scripts; the tools themselves (vite, vitest, wrangler, node --test) still run on Node.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json # "packageManager": "bun@x.y.z"
      - name: Install pinned dependencies
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: bun install --frozen-lockfile
      # Rebuild from the checked commit; do not deploy a downloaded PR artifact.
      # Cloudflare deploy credentials are available only to the deployment step.
      - name: Build the release
        run: |
          bun run cf:typegen
          bun run build:worker
      - name: Deploy the built Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config dist/server/wrangler.json
